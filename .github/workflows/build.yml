name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zipalign apksigner

      - name: Download and Rebrand Official APK
        run: |
          curl -L -o original.apk https://github.com/2dust/v2rayNG/releases/download/1.9.4/v2rayNG_1.9.4_arm64-v8a.apk
          apktool d original.apk -o apk_out
          find apk_out/res -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">ZamanNG<\/string>/g' {} +
          apktool b apk_out -o unsigned.apk
          zipalign -v -p 4 unsigned.apk aligned.apk
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ZamanNG, OU=Zaman, O=Zaman, L=Tehran, C=IR"
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out ZamanNG-v1.9.4.apk aligned.apk
          mkdir -p output
          mv ZamanNG-v1.9.4.apk output/

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: ZamanNG-Official-Release
          path: output/*.apk
