name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./V2rayNG
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: V2rayNG/app/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleOssDebug -x lint -x test --stacktrace || ./gradlew assembleDebug -x lint -x test --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZamanNG-Turquoise-APK
          path: V2rayNG/app/build/outputs/apk/**/*.apk
