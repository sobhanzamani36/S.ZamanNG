
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: |
          chmod +x ./V2rayNG/gradlew

      - name: Build APK with Libs
        run: |
          cd V2rayNG
          ./gradlew assembleOssDebug -x lint -x test --continue || ./gradlew assembleDebug -x lint -x test --continue

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZamanNG-Official-APK
          path: |
            **/build/outputs/apk/**/*.apk
