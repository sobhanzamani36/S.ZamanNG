name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: chmod +x ./V2rayNG/gradlew

      - name: Build Core Libs
        run: |
          cd V2rayNG
          # دانلود یا کپی اتوماتیک هسته آماده برای رفع Unresolved reference 'go'
          mkdir -p app/libs
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/v2rayNG/releases/download/1.9.4/libv2ray.aar || true

      - name: Build APK with Gradle
        run: |
          cd V2rayNG
          ./gradlew assembleOssDebug -x lint -x test || ./gradlew assembleDebug -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZamanNG-Official-APK
          path: V2rayNG/app/build/outputs/apk/**/*.apk
